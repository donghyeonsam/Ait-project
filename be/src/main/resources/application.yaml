logging:
  level:
    com.aitserver: DEBUG

spring:
  application:
    name: aitServer

  datasource:
    url: jdbc:mysql://localhost:3307/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update # 혹은 create, validate 등 팀 컨벤션에 맞게 설정
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: always

  docker:
    compose:
      file: "./infra/docker-compose.yml"
      lifecycle-management: none

  jackson:
    mapper:
      sort-properties-alphabetically: false

  gms:
    base-url: ${GMS_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1}
    api-key: ${GMS_KEY}
    model: ${GMS_MODEL:gpt-5.4-mini}

