logging:
  level:
    com.aitserver: DEBUG

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration: 3600000      # 1시간 (밀리초)
  refresh-token-expiration: 604800000   # 7일 (밀리초)

server:
  port: 8080
  address: 0.0.0.0

fastapi:
  url: ${FASTAPI_URL}
  audioUrl: ${FASTAPI_AUDIOURL}

spring:
  application:
    name: aitServer

  datasource:
    url: jdbc:mysql://localhost:3307/${MYSQL_DATABASE}?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate # 혹은 create, validate 등 팀 컨벤션에 맞게 설정
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: always

  docker:
    compose:
      file: "./infra/docker-compose.yml"
      lifecycle-management: none

  jackson:
    mapper:
      sort-properties-alphabetically: false

  gms:
    base-url: ${GMS_BASE_URL}
    api-key: ${GMS_API_KEY}
    model: ${GMS_MODEL}

  livekit:
    # Spring Boot가 방 생성·조회·삭제 API를 호출할 주소
    api-url: ${LIVEKIT_API_URL:http://localhost:7880}

    # 나중에 React 브라우저에 반환할 WebSocket 주소
    ws-url: ${LIVEKIT_WS_URL:ws://localhost:7880}

    api-key: ${LIVEKIT_API_KEY}
    api-secret: ${LIVEKIT_API_SECRET}

  servlet:
    multipart:
      max-file-size: 20MB      # 파일 1개당 최대 허용 용량
      max-request-size: 20MB   # 요청 1번당 최대 허용 용량 (파일 여러 개 묶음)

# http://localhost:8080/swagger-ui/index.html#/

file:
  upload:
    dir: C:/aitserver/uploads/