logging:
  level:
    com.aitserver: DEBUG

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration: 36000000      # 1시간 (밀리초)
  refresh-token-expiration: 604800000   # 7일 (밀리초)

server:
  port: 8080
  address: 0.0.0.0

fastapi:
  url: ${FASTAPI_URL}
  audioUrl: ${FASTAPI_AUDIOURL}

spring:
  application:
    name: aitServer

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB

  datasource:
    url: jdbc:mysql://localhost:3307/${MYSQL_DATABASE}?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 60
      minimum-idle: 10


  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate # 혹은 create, validate 등 팀 컨벤션에 맞게 설정
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 100  #1:n 관계 + page

  sql:
    init:
      mode: never # 꼭 확인!!!!!!

  docker:
    compose:
      file: "./infra/docker-compose.yml"
      lifecycle-management: none

  jackson:
    mapper:
      sort-properties-alphabetically: false

  gms:
    base-url: ${GMS_BASE_URL}
    api-key: ${GMS_API_KEY}
    model: ${GMS_MODEL}

  livekit:
    # Spring Boot가 방 생성·조회·삭제 API를 호출할 주소
    api-url: ${LIVEKIT_API_URL:http://localhost:7880}

    # 나중에 React 브라우저에 반환할 WebSocket 주소
    ws-url: ${LIVEKIT_WS_URL:ws://localhost:7880}

    api-key: ${LIVEKIT_API_KEY}
    api-secret: ${LIVEKIT_API_SECRET}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    default-encoding: UTF-8

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # 타임아웃 설정
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# http://localhost:8080/swagger-ui/index.html#/

file:
  upload:
    dir: ${FILE_UPLOAD_DIR:C:/aitserver/uploads/}

google:
  client:
    id: ${GOOGLE_CLIENT_ID}
    secret: ${GOOGLE_CLIENT_SECRET}
    allowed-redirect-uris: ${GOOGLE_ALLOWED_REDIRECT_URIS}

github:
  client:
    id: ${GITHUB_CLIENT_ID}
    secret: ${GITHUB_CLIENT_SECRET}
    allowed-redirect-uris: ${GITHUB_ALLOWED_REDIRECT_URIS}