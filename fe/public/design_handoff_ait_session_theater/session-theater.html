<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Ait 면접 세션 — 몰입형 시어터 (디자인 레퍼런스)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
body{margin:0;background:#EDEFF2;font-family:Pretendard,-apple-system,sans-serif;display:grid;place-items:center;min-height:100vh}
@keyframes ait-pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</head>
<body>
<div data-screen-label="2b 몰입형 시어터" style="width:1440px;height:900px;background:#0F172A;position:relative;overflow:hidden;box-sizing:border-box">
  <img src="interviewer-feed.png" alt="AI 면접관" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,.55) 0%,rgba(15,23,42,0) 22%,rgba(15,23,42,0) 48%,rgba(15,23,42,.78) 100%)"></div>
  <header style="position:absolute;top:0;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;box-sizing:border-box">
    <div style="display:flex;align-items:center;gap:36px">
      <div style="font-size:22px;font-weight:800;color:#FFFFFF;letter-spacing:-.02em">Ait</div>
      <span style="display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);font-size:13px;font-weight:600;color:#FFFFFF;backdrop-filter:blur(6px)"><span style="width:7px;height:7px;border-radius:50%;background:#E74C3C;animation:ait-pulse 1.6s ease-in-out infinite"></span>면접 진행 중 · 질문 1/10</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <button style="padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#FFFFFF;font-size:12.5px;font-weight:600;cursor:pointer">⟲ 질문 다시 듣기</button>
      <button style="padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#FFFFFF;font-size:12.5px;font-weight:600;cursor:pointer">면접 종료</button>
    </div>
  </header>
  <div style="position:absolute;left:0;right:0;bottom:0;padding:0 48px 36px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box">
    <div style="display:flex;align-items:flex-end;gap:24px">
      <div style="flex:1;background:rgba(15,23,42,.5);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:22px 28px;backdrop-filter:blur(14px)">
        <div style="font-size:12px;font-weight:600;letter-spacing:.08em;color:rgba(255,255,255,.65);margin-bottom:10px">질문 1</div>
        <p style="margin:0;font-size:19px;line-height:1.6;font-weight:600;color:#FFFFFF;text-wrap:pretty">운영체제에서 프로세스 관리가 무엇을 의미하는지 설명해 주시고, CPU를 여러 프로세스가 나눠 쓰는 상황에서 운영체제가 어떤 기준으로 실행 대상을 정하는지 말씀해 주시겠습니까?</p>
      </div>
      <div style="flex:none;display:flex;flex-direction:column;align-items:center;gap:9px">
        <button style="display:flex;align-items:center;justify-content:center;gap:10px;width:230px;height:60px;border:none;border-radius:999px;background:#FFFFFF;color:#1A2A4A;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.3)">🎙 답변 녹음 시작</button>
        <span style="font-size:12px;color:rgba(255,255,255,.75)">Space 키로도 실행할 수 있어요</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:24px">
      <div style="display:flex;align-items:center;gap:22px">
        <div style="display:flex;align-items:center;gap:9px"><span style="font-size:14px">🎤</span><div style="width:120px;height:4px;border-radius:999px;background:rgba(255,255,255,.25);position:relative"><span style="position:absolute;left:0;top:0;height:100%;width:45%;border-radius:999px;background:#FFFFFF"></span></div></div>
        <div style="display:flex;align-items:center;gap:9px"><span style="font-size:14px">🔊</span><div style="width:120px;height:4px;border-radius:999px;background:rgba(255,255,255,.25);position:relative"><span style="position:absolute;left:0;top:0;height:100%;width:60%;border-radius:999px;background:#FFFFFF"></span></div></div>
      </div>
      <span style="font-size:12px;color:rgba(255,255,255,.6)">🛡 녹음 파일은 음성 인식 처리에만 사용되고 저장되지 않습니다</span>
    </div>
  </div>
</div>
</body>
</html>
