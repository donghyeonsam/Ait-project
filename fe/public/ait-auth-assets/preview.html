<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ait Auth Assets</title><style>*{box-sizing:border-box}body{margin:0;padding:48px;background:#f6f8fc;color:#17284d;font-family:Inter,Pretendard,Arial,sans-serif}.wrap{max-width:1200px;margin:auto}h1{font-size:32px;margin:0 0 8px}p{color:#64748b}.section{margin-top:36px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#fff;border:1px solid #dde5f0;border-radius:18px;padding:22px;box-shadow:0 6px 20px rgba(23,40,77,.06)}.card img{display:block;max-width:100%;margin:auto}.logo img{height:52px}.mark img{height:58px}.illustrations{grid-template-columns:repeat(auto-fit,minmax(460px,1fr))}.illustrations img{height:310px}.icons .card{display:flex;align-items:center;gap:14px}.icons img{width:28px;height:28px;margin:0;color:#17284d}.name{font-size:14px;color:#52647f}</style></head><body><main class="wrap"><h1>Ait 로그인·회원가입 에셋</h1><p>SVG 벡터 미리보기</p><section class="section"><h2>브랜드</h2><div class="grid"><div class="card logo"><img src="brand/ait-logo.svg"><div class="name">ait-logo.svg</div></div><div class="card mark"><img src="brand/ait-mark.svg"><div class="name">ait-mark.svg</div></div><div class="card"><img src="decorations/auth-wave.svg"><div class="name">auth-wave.svg</div></div></div></section><section class="section"><h2>일러스트</h2><div class="grid illustrations"><div class="card"><img src="illustrations/login-ai-interview.svg"><div class="name">login-ai-interview.svg</div></div><div class="card"><img src="illustrations/signup-growth.svg"><div class="name">signup-growth.svg</div></div></div></section><section class="section"><h2>아이콘</h2><div class="grid icons" id="icons"></div></section></main><script>const names=['user','mail','lock','eye','check','check-circle','arrow-right','video','report','google','github'];document.querySelector('#icons').innerHTML=names.map(n=>`<div class="card"><img src="icons/${n}.svg"><span class="name">${n}.svg</span></div>`).join('')</script></body></html>
